name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  install-test:
    strategy:
      matrix:
        os:
        - image: ubuntu:24.04
          name: ubuntu
        - image: fedora:42
          name: fedora
        - image: cachyos/cachyos:latest
          name: cachyos
    container:
      image: ${{matrix.os.image}}
    runs-on: ubuntu-latest
    steps:
      - name: install git
        if: matrix.os.name == 'ubuntu'
        run: |
          apt-get update
          apt-get install git -y
          rm -rf /var/lib/apt/lists/*
      - name: install git
        if: matrix.os.name == 'fedora'
        run: |
          dnf install git -y
      - name: install git
        if: matrix.os.name == 'cachyos'
        run: |
          pacman -Syu --noconfirm git
      - uses: actions/checkout@v4
      - name: workaround github actions nonsense
        run: |
          chown -R $(id -un):$(id -gn) .
      - name: install
        env:
          command: ${{matrix.os.name}}
        run: |
          ./test-full-install.sh "$command"
